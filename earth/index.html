<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1433">
<meta name="description" content="손가락으로 돌려 보는 나만의 3D 가상 지구본">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="지구본">
<title>나의 가상 지구본</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<script>
/* 첫 화면 깜빡임 방지: 저장된 테마를 먼저 적용 */
(function () {
  var pref = 'system';
  try { pref = localStorage.getItem('globe.theme') || 'system'; } catch (e) {}
  var dark = pref === 'dark' || (pref === 'system' && !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches));
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme-pref', pref);
})();
</script>
<style>
:root {
  --space: #060b1e;
  --space2: #0b1433;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --radius: 20px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --t: .18s;
  --sab: env(safe-area-inset-bottom, 0px);
  --sat: env(safe-area-inset-top, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
/* 다크: 어두운 유리 */
:root[data-theme="dark"] {
  --panel: rgba(13, 21, 46, .82);
  --panel-solid: #0f1834;
  --panel-border: rgba(140, 180, 255, .18);
  --text: #eef3ff;
  --muted: #b4c0de;
  --accent: #6cc4ff;
  --accent-text: #04122b;
  --accent-soft: rgba(108, 196, 255, .16);
  --field: rgba(255, 255, 255, .07);
  --field-border: rgba(180, 205, 255, .28);
  --btn: rgba(255, 255, 255, .08);
  --btn-hover: rgba(255, 255, 255, .16);
  --btn-glow: 0 6px 22px rgba(108, 196, 255, .28);
  --item-hover: rgba(255, 255, 255, .09);
  --danger: #ff8a8a;
  --danger-bg: rgba(255, 90, 90, .14);
  --danger-hover: rgba(255, 90, 90, .26);
  --ok: #7be3a6;
  --focus: #ffd84d;
  --shadow: 0 12px 40px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
/* 라이트: 밝은 유리 */
:root[data-theme="light"] {
  --panel: rgba(245, 248, 255, .9);
  --panel-solid: #f3f6fd;
  --panel-border: rgba(30, 60, 120, .16);
  --text: #0e1a33;
  --muted: #3c4a69;
  --accent: #1559bd;
  --accent-text: #ffffff;
  --accent-soft: rgba(21, 89, 189, .12);
  --field: rgba(255, 255, 255, .75);
  --field-border: rgba(30, 60, 120, .3);
  --btn: rgba(14, 26, 51, .06);
  --btn-hover: rgba(14, 26, 51, .13);
  --btn-glow: 0 6px 20px rgba(21, 89, 189, .22);
  --item-hover: rgba(14, 26, 51, .07);
  --danger: #b3261e;
  --danger-bg: rgba(179, 38, 30, .09);
  --danger-hover: rgba(179, 38, 30, .17);
  --ok: #1b7a43;
  --focus: #b0004f;
  --shadow: 0 12px 40px rgba(10, 20, 50, .25);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--space); }
body {
  font-family: var(--font); font-weight: 400; line-height: 1.6; color: var(--text);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none; touch-action: manipulation;
}
button, input, select, textarea { font-family: var(--font); color: inherit; }
input, select, textarea { font-size: 16px; }
h2, h3 { margin: 0; font-weight: 700; line-height: 1.35; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; margin: 18px 0 8px; }
strong, b { font-weight: 600; }
.num, time, .tnum { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== 우주 배경과 지구본 (항상 어둡게) ===== */
#stage { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 45%, #0d1940 0%, var(--space2) 45%, var(--space) 100%); }
#stars, #twinkle, #gl, #ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#twinkle { animation: twinkle 3.2s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }
#ov { touch-action: none; outline: none; cursor: grab; }
#ov.dragging { cursor: grabbing; }
#ov.pointer { cursor: pointer; }
#ov.picking { cursor: crosshair; }
#ov:focus-visible { box-shadow: inset 0 0 0 3px var(--focus); }

#tooltip {
  position: fixed; left: 0; top: 0; pointer-events: none; z-index: 30; padding: 4px 10px; border-radius: 10px;
  background: rgba(8, 14, 34, .85); color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap;
  border: 1px solid rgba(140, 180, 255, .25); transform: translate(14px, 14px);
}

/* ===== 떠 있는 버튼 ===== */
#fab {
  position: fixed; z-index: 20; right: calc(12px + var(--sar)); bottom: calc(14px + var(--sab));
  display: flex; gap: 10px; align-items: center;
}
.fab {
  width: 50px; height: 50px; border-radius: 50%; border: 1px solid rgba(160, 195, 255, .25);
  background: rgba(12, 20, 46, .62); color: #fff; font-size: 21px; display: grid; place-items: center;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); cursor: pointer; padding: 0;
  transition: background var(--t), transform var(--t), box-shadow var(--t);
}
.fab svg { width: 24px; height: 24px; transition: transform var(--t); }
#compassNeedle { transition: transform .2s; }
#topbar {
  position: fixed; z-index: 15; left: calc(12px + var(--sal)); top: calc(10px + var(--sat)); right: calc(12px + var(--sar));
  display: flex; gap: 8px; align-items: flex-start; pointer-events: none; flex-wrap: wrap;
}
#topbar > * { pointer-events: auto; }
.chip-glass {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 12px; border-radius: 999px;
  background: rgba(12, 20, 46, .66); color: #eef3ff; border: 1px solid rgba(160, 195, 255, .25); font-size: 14px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.chip-glass button { min-height: 32px; padding: 2px 12px; border-radius: 999px; border: 0; background: #6cc4ff; color: #04122b; font-weight: 600; cursor: pointer; }
#banner { position: fixed; z-index: 16; left: 50%; transform: translateX(-50%); top: calc(58px + var(--sat)); width: max-content; max-width: min(560px, calc(100% - 24px)); text-align: center; }
#banner .chip-glass { font-size: 15px; justify-content: center; flex-wrap: wrap; border-radius: 18px; padding: 8px 14px; line-height: 1.45; }

/* ===== 시트·카드 (라이트/다크 적용) ===== */
.sheet {
  position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; margin: 0 auto; width: 100%; max-width: 560px;
  max-height: min(80vh, 80dvh); display: flex; flex-direction: column;
  background: var(--panel); color: var(--text); border: 1px solid var(--panel-border); border-bottom: 0;
  border-radius: 22px 22px 0 0; box-shadow: var(--shadow);
  backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
  padding-bottom: var(--sab); animation: sheetIn .22s var(--ease);
}
.sheet.small { max-height: min(56vh, 56dvh); }
.sheet.compact { max-height: min(46vh, 46dvh); }
@keyframes sheetIn { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet > header { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px 18px; }
.sheet > header h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { overflow-y: auto; padding: 4px 18px 18px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.grabber { position: absolute; top: 6px; left: 50%; width: 38px; height: 4px; margin-left: -19px; border-radius: 4px; background: var(--muted); opacity: .45; }
@media (orientation: landscape) and (max-height: 620px) {
  .sheet, .sheet.small, .sheet.compact {
    left: auto; right: calc(8px + var(--sar)); top: calc(8px + var(--sat)); bottom: calc(8px + var(--sab)); margin: 0;
    width: min(400px, 52vw); max-height: none; border-radius: 20px; border-bottom: 1px solid var(--panel-border); padding-bottom: 0;
  }
  .sheet.small, .sheet.compact { top: auto; max-height: calc(100% - 16px); }
  #fab { flex-direction: column-reverse; }
}
.muted { color: var(--muted); }
.small-text { font-size: .86rem; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }
.stack { display: grid; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
hr { border: 0; border-top: 1px solid var(--panel-border); margin: 14px 0; }
.note { font-size: .86rem; color: var(--muted); background: var(--accent-soft); border-radius: 12px; padding: 8px 12px; margin: 8px 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 6px 0 12px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; }

/* ===== 버튼 ===== */
.btn {
  min-height: 44px; padding: 8px 16px; border-radius: 14px; border: 1px solid var(--field-border); background: var(--btn);
  font-size: 15px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: background var(--t), transform var(--t), box-shadow var(--t), border-color var(--t), color var(--t);
}
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
.btn.danger { color: var(--danger); background: var(--danger-bg); border-color: transparent; }
.btn.block { width: 100%; }
.btn .go, .list-item .go { opacity: 0; transition: opacity var(--t), transform var(--t); }
.icon-btn {
  width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: transparent; font-size: 20px; line-height: 1;
  cursor: pointer; display: inline-grid; place-items: center; padding: 0; transition: background var(--t), transform var(--t);
}
.icon-btn > span, .icon-btn > svg { transition: transform var(--t); display: inline-block; }
.icon-btn.danger { color: var(--danger); }
button:disabled, .btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
.menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.menu-item {
  min-height: 82px; border-radius: 16px; border: 1px solid var(--panel-border); background: var(--btn); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 4px; font-size: 14px; font-weight: 600;
  transition: background var(--t), transform var(--t), box-shadow var(--t), border-color var(--t);
}
.menu-item .ic { font-size: 24px; line-height: 1.2; }
.theme-btn { min-width: 44px; min-height: 44px; border-radius: 999px; padding: 4px 12px; font-size: 14px; }

/* 입력 */
.field { display: grid; gap: 4px; margin: 10px 0; }
.field > span { font-size: .9rem; color: var(--muted); font-weight: 600; }
input[type="text"], input[type="search"], input[type="date"], input[type="time"], input[type="number"], select, textarea {
  width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--field-border);
  background: var(--field); outline: none; transition: border-color var(--t), box-shadow var(--t);
}
textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--accent); }
input[type="range"] { width: 100%; height: 44px; accent-color: var(--accent); cursor: pointer; }
.seg { display: flex; padding: 3px; border-radius: 14px; background: var(--btn); border: 1px solid var(--panel-border); gap: 2px; }
.seg button {
  flex: 1; min-height: 40px; border: 0; border-radius: 11px; background: transparent; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: background var(--t), color var(--t), transform var(--t);
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; cursor: pointer; border-radius: 12px; padding: 2px 6px; margin: 0 -6px; transition: background var(--t); }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 30px; background: var(--btn-hover); border: 1px solid var(--field-border); transition: background var(--t); pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); transition: transform var(--t); }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(20px); }
.switch input:focus-visible + i { outline: 2px solid var(--focus); outline-offset: 2px; }

/* 목록 */
.list { display: grid; gap: 4px; margin: 6px 0; }
.list-item {
  display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 10px; border-radius: 14px; border: 0; background: transparent;
  width: 100%; text-align: left; cursor: pointer; font-size: 15px; transition: background var(--t);
}
.list-item .main { flex: 1; min-width: 0; }
.list-item .t, .list-item .s { display: block; }
.list-item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item .s { font-size: .84rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item .lead { font-size: 22px; width: 32px; text-align: center; flex: none; }
.list-row { display: flex; align-items: center; gap: 4px; border-radius: 14px; }
.list-row > .list-item { flex: 1; min-width: 0; }
.pin-dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; flex: none; border: 2px solid rgba(255,255,255,.8); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.chip {
  min-height: 36px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--field-border); background: transparent; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: background var(--t), transform var(--t);
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: transparent; }
.empty { text-align: center; color: var(--muted); padding: 22px 8px; }

/* 스타일 카드 */
.style-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.style-card {
  border-radius: 16px; border: 2px solid var(--panel-border); background: var(--btn); padding: 10px; cursor: pointer; text-align: center; font-size: 14px; font-weight: 600;
  transition: transform var(--t), box-shadow var(--t), border-color var(--t), background var(--t);
}
.style-card[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.mini-globe {
  width: 64px; height: 64px; margin: 0 auto 6px; border-radius: 50%; background-size: 200% 100%; background-position: 0 50%;
  box-shadow: inset -10px -8px 18px rgba(0,0,0,.45), 0 0 10px rgba(120,190,255,.35); transition: background-position 1.2s ease;
}

/* 퀴즈 */
.quiz-opts { display: grid; gap: 8px; margin: 10px 0; }
.quiz-opt {
  min-height: 50px; border-radius: 14px; border: 1px solid var(--field-border); background: var(--btn); font-size: 16px; font-weight: 600; cursor: pointer; text-align: left; padding: 8px 14px;
  transition: background var(--t), transform var(--t), box-shadow var(--t), border-color var(--t);
}
.quiz-opt.right { background: rgba(60, 200, 120, .25); border-color: var(--ok); }
.quiz-opt.wrong { background: var(--danger-bg); border-color: var(--danger); }
.progress { height: 6px; border-radius: 6px; background: var(--btn-hover); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.stat-big { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar-row { display: grid; grid-template-columns: 82px 1fr 52px; gap: 8px; align-items: center; font-size: .9rem; margin: 4px 0; }
.bar { height: 10px; border-radius: 10px; background: var(--btn-hover); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* 토스트·대화상자 */
#toasts { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); top: calc(10px + var(--sat)); display: grid; gap: 8px; width: min(92vw, 440px); pointer-events: none; }
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: var(--panel-solid); color: var(--text);
  border: 1px solid var(--panel-border); box-shadow: var(--shadow); font-size: 15px; animation: sheetIn .2s var(--ease);
}
.toast .msg { flex: 1; }
.toast .btn { min-height: 36px; padding: 4px 12px; }
#dialog { position: fixed; inset: 0; z-index: 80; background: rgba(0, 4, 16, .55); display: grid; place-items: center; padding: 18px; }
#dialog .box { width: min(420px, 100%); background: var(--panel-solid); color: var(--text); border: 1px solid var(--panel-border); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); max-height: 86vh; overflow: auto; }
#dialog .box p { margin: 8px 0 14px; white-space: pre-line; }
#loading { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; pointer-events: none; color: #cfe0ff; font-size: 15px; }
#loading span { background: rgba(8, 14, 34, .7); padding: 8px 16px; border-radius: 999px; }
.err-box { margin: 10px 0; padding: 10px 14px; border-radius: 12px; background: var(--danger-bg); color: var(--danger); font-weight: 600; }
.reminder { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--accent-soft); margin-bottom: 12px; font-size: 14px; }
.reminder .msg { flex: 1; }
.flag { font-size: 2.1rem; line-height: 1; }
.card-head { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
.card-head .names { min-width: 0; }
.card-head .ko { font-size: 1.2rem; font-weight: 700; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: transform var(--t), border-color var(--t); }
.swatch[aria-pressed="true"] { border-color: var(--text); }
.emoji-pick { display: flex; gap: 4px; flex-wrap: wrap; }
.emoji-pick button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid transparent; background: var(--btn); font-size: 22px; cursor: pointer; transition: background var(--t), transform var(--t); }
.emoji-pick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.check { width: 22px; height: 22px; accent-color: var(--accent); flex: none; cursor: pointer; }
.clock-time { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.suggest { position: relative; }
.suggest .list { position: absolute; z-index: 3; left: 0; right: 0; top: 100%; margin-top: 4px; background: var(--panel-solid); border: 1px solid var(--panel-border); border-radius: 14px; padding: 4px; box-shadow: var(--shadow); max-height: 220px; overflow: auto; }

/* ===== 공통 상호작용 ===== */
button, .btn, .menu-item, .list-item, .chip, .seg button, .style-card, .quiz-opt, .swatch, .switch-row, .fab, .icon-btn, select, input[type="range"], label.switch-row { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.fab:focus-visible { outline: 2px solid #ffd84d; }
.btn:active, .icon-btn:active, .menu-item:active, .list-item:active, .chip:active, .seg button:active, .style-card:active, .quiz-opt:active, .fab:active, .swatch:active, .emoji-pick button:active { transform: scale(.97); }
button:disabled:active { transform: none; }

/* 호버: 마우스가 있는 기기에서만 */
@media (hover: hover) and (pointer: fine) {
  .btn:not(:disabled):hover { background: var(--btn-hover); transform: translateY(-1.5px); box-shadow: var(--btn-glow); }
  .btn.primary:not(:disabled):hover { background: var(--accent); filter: brightness(1.1); }
  .btn.danger:not(:disabled):hover { background: var(--danger-hover); box-shadow: 0 6px 20px rgba(255, 80, 80, .25); }
  .btn:not(:disabled):hover .go { opacity: 1; }
  .icon-btn:not(:disabled):hover { background: var(--btn-hover); }
  .icon-btn:not(:disabled):hover > span, .icon-btn:not(:disabled):hover > svg { transform: scale(1.08); }
  .icon-btn.danger:not(:disabled):hover { background: var(--danger-hover); }

<script>
'use strict';
/* =========================================================
 * 나의 가상 지구본 — 앱 본체
 * ========================================================= */
const APP_NAME = '나의 가상 지구본';
const APP_VERSION = '1.0.1';
const FORMAT_VERSION = 1;
const DEG = Math.PI / 180;
const EARTH_KM = 6371.0088;

const $ = (s, el = document) => el.querySelector(s);

/* ---------- 저장소 (localStorage를 못 써도 멈추지 않게) ---------- */

/* ---------- 데이터 ---------- */
const WD = (window.WORLD_DATA && Array.isArray(window.WORLD_DATA.countries)) ? window.WORLD_DATA : null;
const COUNTRIES = [];
const CBYID = {};
const CITIES = [];
const CITYBYKEY = {};
const CONTINENTS = ['아시아', '유럽', '아프리카', '북아메리카', '남아메리카', '오세아니아', '남극', '기타'];

function prepareData() {
  if (!WD) return;
  WD.countries.forEach((c, i) => {
    const polys = [];
    let bx0 = 999, by0 = 999, bx1 = -999, by1 = -999;
    for (const poly of c.p) {
      const rings = poly.map(r => { const a = new Float32Array(r.length); for (let k = 0; k < r.length; k++) a[k] = r[k] / 100; return a; });
      const o = rings[0];

      for (let k = 0; k < o.length; k += 2) { x0 = Math.min(x0, o[k]); x1 = Math.max(x1, o[k]); y0 = Math.min(y0, o[k + 1]); y1 = Math.max(y1, o[k + 1]); }

    }
    let main = polys[0];
    for (const q of polys) if ((q.bb[2] - q.bb[0]) * (q.bb[3] - q.bb[1]) > (main.bb[2] - main.bb[0]) * (main.bb[3] - main.bb[1])) main = q;
    // 라벨 위치가 들어 있는 폴리곤이 있으면 그것을 본토로 사용
    for (const q of polys) if (c.lx >= q.bb[0] && c.lx <= q.bb[2] && c.ly >= q.bb[1] && c.ly <= q.bb[3]) { main = q; break; }

    delete country.p;
    country.flag = flagEmoji(c.iso2);
    country.cho = choseong(c.ko);
    COUNTRIES.push(country);
    CBYID[c.id] = country;
  });
  WD.cities.forEach(c => {
    const city = Object.assign({}, c, { key: c.c + ':' + c.en });
    city.cho = choseong(c.ko);
    city.country = CBYID[c.c] || null;
    CITIES.push(city); CITYBYKEY[city.key] = city;

}
function flagEmoji(iso2) {
  if (!iso2 || !/^[A-Z]{2}$/.test(iso2)) return '🏳️';
  return String.fromCodePoint(...[...iso2].map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65));
}
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';

  let r = '';

}

/* 점이 국가 폴리곤 안에 있는지 (경계 상자로 먼저 거르기) */

  return inside;
}

  if (lat == null) return null;
  for (const c of COUNTRIES) {
    const b = c.bb;
    if (lon < b[0] || lon > b[2] || lat < b[1] || lat > b[3]) continue;
    for (const p of c.polys) {
      const q = p.bb;
      if (lon < q[0] || lon > q[2] || lat < q[1] || lat > q[3]) continue;
      let inside = false;
      for (const r of p.rings) if (pointInRing(r, lon, lat)) inside = !inside;
      if (inside) return c;

/* ---------- 설정과 기록 ---------- */
const DEFAULT_SETTINGS = {
  style: 'satellite', borders: true, grid: 'off', special: false, cities: true, names: true, clouds: true,
  autoRotate: true, quality: 'normal', units: 'km', clock24: true, wakeLock: false,

const S = Object.assign({}, DEFAULT_SETTINGS, store.get('settings', {}));
if (!['satellite', 'political', 'simple', 'night'].includes(S.style)) S.style = 'satellite';
if (!['high', 'normal', 'saver'].includes(S.quality)) S.quality = 'normal';
let PINS = sanitizePins(store.get('pins', []));
let VISITED = new Set((store.get('visited', []) || []).filter(id => typeof id === 'string'));
let CLOCKS = store.get('clocks', null);
let QUIZ = store.get('quiz', {}) || {};
let META = store.get('meta', {}) || {};
if (!Array.isArray(CLOCKS)) CLOCKS = ['KOR:Seoul', 'GBR:London', 'USA:New York', 'FRA:Paris', 'AUS:Sydney'];
if (typeof QUIZ !== 'object' || Array.isArray(QUIZ)) QUIZ = {};

function sanitizePins(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.filter(p => p && typeof p === 'object' && typeof p.name === 'string' && p.name.trim() && isFinite(p.lat) && isFinite(p.lon))
    .map(p => ({
      id: String(p.id || uid()), name: String(p.name).slice(0, 80), memo: String(p.memo || '').slice(0, 2000),
      color: /^#[0-9a-f]{6}$/i.test(p.color) ? p.color : '#ff6b6b', emoji: String(p.emoji || '📍').slice(0, 8),
      cat: p.cat === 'wish' ? 'wish' : 'visited', lat: clamp(+p.lat, -90, 90), lon: wrapLon(+p.lon),
      createdAt: p.createdAt || nowISO(), updatedAt: p.updatedAt || p.createdAt || nowISO(),
    }));
}
const saveSettings = () => store.set('settings', S);
const savePins = () => store.set('pins', PINS);
const saveVisited = () => store.set('visited', [...VISITED]);
const saveClocks = () => store.set('clocks', CLOCKS);
const saveQuiz = () => store.set('quiz', QUIZ);
const saveMeta = () => store.set('meta', META);

/* ---------- 카메라·투영 (정사영) ---------- */
const cam = { lat: HOME.lat, lon: HOME.lon, zoom: 1, roll: 0 };
const view = { w: 1, h: 1, dpr: 1, cx: 0, cy: 0, R: 100, padB: 0, padR: 0, padBT: 0, padRT: 0, U: [1, 0, 0], V: [0, 1, 0], C: [0, 0, 1] };
const MIN_ZOOM = 0.55, MAX_ZOOM = 26;
function ecef(lat, lon) {
  const la = lat * DEG, lo = lon * DEG, cl = Math.cos(la);
  return [cl * Math.cos(lo), cl * Math.sin(lo), Math.sin(la)];
}
function updateView() {
  view.R = Math.min(view.w, view.h) * 0.42 * cam.zoom;
  view.cx = (view.w - view.padR) / 2; view.cy = (view.h - view.padB) / 2;
  const la = cam.lat * DEG, lo = cam.lon * DEG;
  const C = ecef(cam.lat, cam.lon);
  const E = [-Math.sin(lo), Math.cos(lo), 0];
  const N = [-Math.sin(la) * Math.cos(lo), -Math.sin(la) * Math.sin(lo), Math.cos(la)];
  const cr = Math.cos(cam.roll), sr = Math.sin(cam.roll);

/* 위도·경도 → 화면 좌표 (CSS 픽셀), d<0이면 뒤쪽 반구 */
function project(lat, lon, out) {
  const p = ecef(lat, lon);
  return projectVec(p, out);
}
function projectVec(p, out = {}) {

  out.x = view.cx + view.R * (p[0] * U[0] + p[1] * U[1] + p[2] * U[2]);
  out.y = view.cy - view.R * (p[0] * V[0] + p[1] * V[1] + p[2] * V[2]);
  out.d = p[0] * C[0] + p[1] * C[1] + p[2] * C[2];
  return out;
}
/* 화면 좌표 → 위도·경도 (역투영). 지구 밖이면 null */
function unproject(x, y) {
  const u = (x - view.cx) / view.R, v = (view.cy - y) / view.R;
  const d2 = u * u + v * v;
  if (d2 > 1) return null;
  const w = Math.sqrt(1 - d2), U = view.U, V = view.V, C = view.C;
  const px = u * U[0] + v * V[0] + w * C[0], py = u * U[1] + v * V[1] + w * C[1], pz = u * U[2] + v * V[2] + w * C[2];
  return { lat: Math.asin(clamp(pz, -1, 1)) / DEG, lon: Math.atan2(py, px) / DEG };
}
function gcDistanceKm(a, b) {
  const la1 = a.lat * DEG, la2 = b.lat * DEG, dla = la2 - la1, dlo = (b.lon - a.lon) * DEG;
  const h = Math.sin(dla / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dlo / 2) ** 2;

}
function gcPoints(a, b, n) {
  const A = ecef(a.lat, a.lon), B = ecef(b.lat, b.lon);
  const dot = clamp(A[0] * B[0] + A[1] * B[1] + A[2] * B[2], -1, 1), om = Math.acos(dot), so = Math.sin(om);
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    if (so < 1e-6) { pts.push(A); continue; }
    const k1 = Math.sin((1 - t) * om) / so, k2 = Math.sin(t * om) / so;

}
const vecToLatLon = p => ({ lat: Math.asin(clamp(p[2], -1, 1)) / DEG, lon: Math.atan2(p[1], p[0]) / DEG });

/* ---------- 태양 위치 (태양이 바로 위에 오는 지점) ---------- */
const TIME_RANGE_MS = 366 * 86400000;
const sim = { live: true, offset: 0, playing: false, speed: 3600 };   // speed: 실제 1초당 흐르는 초
function simDate() {
  return new Date(Date.now() + (sim.live ? 0 : sim.offset));
}
function setSimTime(ms) {
  const off = clamp(ms - Date.now(), -TIME_RANGE_MS, TIME_RANGE_MS);
  sim.offset = off; sim.live = false;
}
function subsolar(date) {
  const jd = date.getTime() / 86400000 + 2440587.5;
  const n = jd - 2451545.0;
  const L = (280.460 + 0.9856474 * n) % 360;
  const g = ((357.528 + 0.9856003 * n) % 360) * DEG;

  const eps = (23.439 - 0.0000004 * n) * DEG;

  const dec = Math.asin(Math.sin(eps) * Math.sin(lam));
  const gmst = ((18.697374558 + 24.06570982441908 * n) % 24 + 24) % 24;

/* ---------- 시간대 ---------- */
const fmtCache = {};
function dtf(tz, opts) {

    catch (e) { fmtCache[key] = null; }

}

  return f ? f.format(date) : '—';
}

  if (withYear) opts.year = 'numeric';
  return new Intl.DateTimeFormat('ko-KR', opts).format(date);
}
function fmtOffsetDiff(mins) {
  if (mins === 0) return '한국과 같음';
  const sign = mins > 0 ? '+' : '−', a = Math.abs(mins), h = Math.floor(a / 60), m = a % 60;
  return `한국보다 ${sign}${h}시간${m ? ' ' + m + '분' : ''}`;
}
function fmtLatLon(lat, lon) {
  return `${Math.abs(lat).toFixed(2)}°${lat >= 0 ? 'N' : 'S'}, ${Math.abs(lon).toFixed(2)}°${lon >= 0 ? 'E' : 'W'}`;
}
function fmtDist(km) {
  const v = S.units === 'mi' ? km / KM_PER_MI : km;
  return Math.round(v).toLocaleString('ko-KR') + (S.units === 'mi' ? ' 마일' : ' km');
}
function ymd(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

/* ---------- 노이즈 (가로로 이어지는 값 노이즈) ---------- */
function makeNoise(seed) {

function searchAll(q, opts = { countries: true, cities: true }) {
  q = String(q || '').trim().toLowerCase();
  if (!q) return [];
  const qs = q.replace(/\s+/g, '');
  const cho = isChoQuery(q);
  const score = (names, choStr) => {
    let best = 0;
    if (cho) { if (choStr === qs) best = 5; else if (choStr.startsWith(qs)) best = 3; else if (choStr.includes(qs)) best = 1; return best; }
    for (const n of names) {
      if (!n) continue;
      const s = String(n).toLowerCase(), s2 = s.replace(/\s+/g, '');
      if (s === q || s2 === qs) return 6;
      if (s.startsWith(q) || s2.startsWith(qs)) best = Math.max(best, 4);
      else if (s.includes(q) || s2.includes(qs)) best = Math.max(best, 2);
    }
    return best;
  };
  const out = [];
  if (opts.countries) for (const c of COUNTRIES) {
    const sc = score([c.ko, c.en, c.enLong, ...(c.alias || []), c.iso3], c.cho);
    if (sc) out.push({ kind: 'country', ref: c, sc: sc + 0.5 });
  }
  if (opts.cities) for (const c of CITIES) {
    const sc = score([c.ko, c.en], c.cho);
    if (sc) out.push({ kind: 'city', ref: c, sc: sc + (c.imp === 1 ? .3 : 0) });
  }
  out.sort((a, b) => b.sc - a.sc || a.ref.ko.localeCompare(b.ref.ko, 'ko'));
  return out.slice(0, 40);
}

}

  0: o => {

    const d = o.data || o;
    return { app: APP_NAME, kind: o.kind || (d.visited || d.quiz ? 'full' : 'pins'), formatVersion: 1, appVersion: o.appVersion, exportedAt: o.exportedAt || null, data: d };

function normalizeImport(obj) {

  if (!Array.isArray(obj) && !obj.app && !obj.pins && !(obj.data && obj.data.pins)) return { error: '이 앱의 저장 파일이 아니에요.' };
  let v = Array.isArray(obj) ? 0 : (+obj.formatVersion || 0);
  if (v > FORMAT_VERSION) return { error: `더 새로운 버전의 앱(형식 ${v})에서 만든 파일이라 읽을 수 없어요. 앱을 새로 고친 뒤 다시 시도해 주세요.` };

}

function resize() {
  const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
  const dpr = Math.min(window.devicePixelRatio || 1, 2, QUALITY[S.quality].dpr);
  const changed = w !== view.w || h !== view.h || dpr !== view.dpr;
  view.w = w; view.h = h; view.dpr = dpr;
  for (const c of [glCanvas, ovCanvas]) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  if (changed) drawStars();
  if (typeof updateSheetPad === 'function' && ovCanvas) updateSheetPad();
  updateView(); requestRender();
}
function init() {

  $('#btnHome').onclick = () => { ui.selectedId = 0; updateStateTex(); flyTo(HOME.lat, HOME.lon, 2.6); };
